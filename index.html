<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RelayFresh</title>
  <meta name="description" content="RelayFresh connects food donors, volunteer riders and people in need: live dispatch, ghost-rider and ghost-station detection, fair-share allocation and food-safety enforcement." />
  <meta name="theme-color" content="#0f766e" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230f766e'/%3E%3Cpath d='M16 2a14 14 0 0 1 0 28z' fill='%2334d399'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Non-blocking font load: on flaky venue wifi the app still starts instantly with system fonts. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="RelayFresh home">
      <span class="logo" aria-hidden="true"></span>
      <span class="brand-text"><b>RelayFresh</b><small>Surplus food, delivered safe</small></span>
    </a>
    <div id="sim-status" class="sim-status" aria-live="off"></div>
    <div class="top-actions">
      <div id="account" class="account"></div>
      <button id="theme" class="btn ghost icon-btn" type="button" aria-label="Toggle dark mode"></button>
    </div>
  </header>
  <nav id="sidebar" class="sidebar" aria-label="Main"></nav>
  <main id="view" class="view" tabindex="-1"></main>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
